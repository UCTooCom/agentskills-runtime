[dependencies]
charset4cj = { path = "../charset4cj" }
## stdx = { git = "https://gitcode.com/Cangjie/cangjie_stdx.git" }

[package]
  cjc-version = "1.0.5"
  compile-option = ""
  description = "a mail utils for cangjie, smtp, pop, imap, base64 has been implemented"
  link-option = ""
  name = "cj_mail"
  output-type = "static"
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  package-configuration = {}

[package.package-configuration."cj_mail.commons"]
  output-type = "static"
[package.package-configuration."cj_mail.encoding"]
  output-type = "static"
[package.package-configuration."cj_mail.encoding.quotedprintable"]
  output-type = "static"
[package.package-configuration."cj_mail.encoding.base64"]
  output-type = "static"
[package.package-configuration."cj_mail.exception"]
  output-type = "static"
[package.package-configuration."cj_mail.imap"]
  output-type = "static"
[package.package-configuration."cj_mail.log"]
  output-type = "static"
[package.package-configuration."cj_mail.pop"]
  output-type = "static"
[package.package-configuration."cj_mail.smtp"]
  output-type = "static"

#----------------------------------------
#  Setting cangjie-stdx
#----------------------------------------

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["../cangjie-stdx-linux-x64-1.0.5.1/linux_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-unknown-windows-gnu]
  compile-option = "--cfg \"ohos=false\""
[target.x86_64-unknown-windows-gnu.bin-dependencies]
  path-option = ["../cangjie-stdx-windows-x64-1.0.5.1/windows_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-w64-mingw32]
  compile-option = "-Woff unused -Woff deprecated --dy-std --cfg \"ohos=false\""
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["../cangjie-stdx-windows-x64-1.0.5.1/windows_x86_64_cjnative/dynamic/stdx"]

[target.aarch64-unknown-linux-gnu]
  compile-option = "--cfg \"ohos=false\""
[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["../cangjie-stdx-linux-aarch64-1.0.5.1/linux_aarch64_cjnative/dynamic/stdx"]

[target.x86_64-apple-darwin]
  compile-option = "--cfg \"ohos=false\""
[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["../cangjie-stdx-mac-x64-1.0.5.1/darwin_x86_64_cjnative/dynamic/stdx"]

[target.aarch64-apple-darwin]
  compile-option = "--cfg \"ohos=false\""
[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["../cangjie-stdx-mac-aarch64-1.0.5.1/darwin_aarch64_cjnative/dynamic/stdx"]
