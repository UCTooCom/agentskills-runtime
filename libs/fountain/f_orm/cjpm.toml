[dependencies]
  charset4cj = { path = "../../charset4cj" }
  f_aspect  = {path = "../f_aspect"}
  f_base  = {path = "../f_base"}
  f_bean  = {path = "../f_bean"}
  f_cache  = {path = "../f_cache"}
  f_collection  = {path = "../f_collection"}
  f_config  = {path = "../f_config"}
  f_data  = {path = "../f_data"}
  f_exception  = {path = "../f_exception"}
  f_log  = {path = "../f_log"}
  f_macros  = {path = "../f_macros"}
  f_mockdb  = {path = "../f_mockdb"}
  f_regex  = {path = "../f_regex"}
  f_pool  = {path = "../f_pool"}
  f_util  = {path = "../f_util"}

[package]
  cjc-version = "1.0.5"
  compile-option = "-Woff all --dy-std"
  override-compile-option = "-Woff all --dy-std"
  description = "orm"
  link-option = ""
  name = "f_orm"
  organization="fountain"
  output-type = "dynamic"
  src-dir = ""
  target-dir = ""
  version = "1.0.45"
  package-configuration = {}
  category = ["Utility"]
  license = ["Apache-2.0"]
  include = ["src"]
  authors = ["吴京润"]

[profile.build]
#  lto = "full"
  incremental = true

[target]
[target.x86_64-unknown-linux-gnu]
  compile-option = "-Woff all --dy-std -ldl"
  override-compile-option = "-Woff all --dy-std -ldl"
[target.aarch64-unknown-linux-gnu]
  compile-option = "-Woff all --dy-std -ldl"
  override-compile-option = "-Woff all --dy-std -ldl"
[target.x86_64-w64-mingw32]
  compile-option = "-Woff all --dy-std -lcrypt32"
  override-compile-option = "-Woff all --dy-std -lcrypt32"
[target.x86_64-apple-darwin]
  compile-option = "-Woff all --dy-std"
  override-compile-option = "-Woff all --dy-std"
[target.aarch64-apple-darwin]
  compile-option = "-Woff all --dy-std"
  override-compile-option = "-Woff all --dy-std"
[target.aarch64-linux-ohos]
  compile-option = "-Woff all --dy-std -ldl"
  override-compile-option = "-Woff all --dy-std -ldl"
[target.x86_64-linux-ohos]
  compile-option = "-Woff all --dy-std -ldl"
  override-compile-option = "-Woff all --dy-std -ldl"