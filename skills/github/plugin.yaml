# github 插件清单（plugingen process 轨生成）
# 保护区外为二开区：停用插件（enabled: false）、调 order、改 command 路径请改这里，重新生成不会被覆盖。
name: github
version: 1.0.0
mode: process
command: ./skills/github/target/release/bin/skill_github.exe
enabled: true
order: 10
autoRestart: true
#region AutoCreateCode
