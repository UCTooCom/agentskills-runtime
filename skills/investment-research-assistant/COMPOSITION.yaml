name: investment-research-assistant
description: 智能投研助理 —— 自动抓取、清洗、提取，输出每日投资简报（金融行业 Agent 最佳实践 SOP）
version: 1.0.0

# 组合步骤：全流程编排（抓取 → 清洗 → 提取 → 生成 → 落库 → 简报）
steps:
  - name: fetch-data
    step_type: script
    script: scripts/fetch_market_data.py
    depends_on: []
    input:
      companies: "${input.companies}"
      date: "${input.date}"
      outdir: "output/raw"

  - name: clean-data
    step_type: script
    script: scripts/clean_market_data.py
    depends_on:
      - fetch-data
    input:
      # v8 修复：fetch 的 outdir 已含 raw，路径模板不再追加 raw（原 `${fetch-data.output}/raw/...` 会产生双重 raw）
      input_file: "${fetch-data.output}/${input.date}.json"
      outdir: "output/clean"

  - name: extract-factors
    step_type: script
    script: scripts/extract_factors.py
    depends_on:
      - clean-data
    input:
      input_file: "${clean-data.output}/${input.date}.json"
      outdir: "output/factors"

  - name: generate-report
    step_type: script
    script: scripts/generate_report.py
    depends_on:
      - extract-factors
    input:
      # v17修复：extract-factors.output 已是 output/factors，不再追加 /factors（原会产生 output/factors/factors/...）
      factors: "${extract-factors.output}/${input.date}.json"
      outdir: "output/brief"
    # v9 修复：step_type 从 llm 改为 script，优先用 scripts/generate_report.py（人工已验证可正确生成预期产出物）
    # 脚本内部已封装 LLM 调用与降级模板化简报逻辑，仅环境不具备才降级用 runtime 大模型

  - name: persist-report
    step_type: script
    script: scripts/save_report_to_db.py
    depends_on:
      - generate-report
    input:
      # v17修复：generate-report.output 已是 output/brief，不再追加 /brief（原会产生 output/brief/brief/...）
      report: "${generate-report.output}/${input.date}.md"
      factors: "${extract-factors.output}/${input.date}.json"
      sql_only: "${input.sql_only}"

  - name: output-brief
    step_type: output
    depends_on:
      - persist-report
    input:
      brief_dir: "${generate-report.output}"
