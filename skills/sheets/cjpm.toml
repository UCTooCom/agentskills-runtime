# skill_sheets 独立工程配置（plugingen process 轨生成）
# 保护区外为二开区：compile-option / output-type / src-dir 等请改这里，重新生成不会被覆盖。
[package]
  cjc-version = "1.1.3"
  compile-option = "--dy-std -Woff all"
  description = "L3 进程隔离轨插件 sheets（独立 executable 工程）"
  link-option = ""
  name = "skill_sheets"
  output-type = "executable"
  src-dir = "src"
  target-dir = "target"
  version = "1.0.0"
  package-configuration = {}
  scripts = {}

#region AutoCreateCode
# ↓ 本行以下由 plugingen 自动维护，重新生成会覆盖；依赖与 stdx 路径请勿手改。
[dependencies]
  "ystyle::cordis_plugin" = { path = "../../libs/cordis-cj/cordis_plugin" }
  "ystyle::cordis_core" = { path = "../../libs/cordis-cj/cordis_core" }
  "jsonvalue" = { path = "../../libs/jsonvalue" }
  "ystyle::jsonrpc" = { path = "../../libs/jsonrpc" }

[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["../../libs/cangjie-stdx-windows-x64-1.1.3.1/windows_x86_64_cjnative/dynamic/stdx"]
#endregion AutoCreateCode
